<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Markdown preview sample diagram</title>
  <desc id="desc">A wide SVG with boxes showing Markdown source, parser, preview, and browser output.</desc>
  <rect width="960" height="360" fill="#f6f8fa"/>
  <rect x="40" y="70" width="180" height="110" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="3"/>
  <rect x="280" y="70" width="180" height="110" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="3"/>
  <rect x="520" y="70" width="180" height="110" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/>
  <rect x="760" y="70" width="160" height="110" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="3"/>
  <path d="M220 125h60m180 0h60m180 0h60" stroke="#57606a" stroke-width="5" stroke-linecap="round"/>
  <path d="M270 115l12 10-12 10m240-20l12 10-12 10m240-20l12 10-12 10" fill="none" stroke="#57606a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">Markdown</text>
  <text x="130" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#57606a">source file</text>
  <text x="370" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">Parser</text>
  <text x="370" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#57606a">GFM + slugs</text>
  <text x="610" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">Preview</text>
  <text x="610" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#57606a">styles + assets</text>
  <text x="840" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">Browser</text>
  <text x="840" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#57606a">live reload</text>
  <rect x="220" y="250" width="520" height="44" rx="22" fill="#0969da"/>
  <text x="480" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">This image should be centered and constrained</text>
</svg>
